name: Checks

# Repository checks for every pull request and every push to main. The job
# names below (compile, policy, structure, secrets, language) are the status
# checks the "checks" ruleset requires, so renaming a job means changing the
# ruleset too.
#
#   compile    every .py compiles on Python 2.7 and pyflakes finds no
#              undefined names
#   policy     the unit tests of the checks, then the rules that keep risky
#              code (network, processes) out of the extension; only
#              lib/telemetry.py may reach the network, and only the
#              endpoint .github/policy/policy.json lists
#   structure  the pyRevit layout: bundles, buttons, icons, extension.json
#   secrets    gitleaks over the whole git history (default rules, plus the
#              allowlist in .github/gitleaks.toml)
#   language   code, comments and UI text are in English
#
# Python runs in the python:2.7 image, the same grammar as the IronPython 2.7
# that pyRevit uses. Third-party code is pinned: actions by commit SHA, images
# by digest, pip packages by version and hash (.github/requirements-ci.txt),
# and pip installs wheels only, so no setup.py of a package runs.
#
# The work tree is mounted read-only (secrets mounts only .git), except in
# compile, where compileall writes .pyc files next to the sources.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # A new push to a pull request replaces the checks still running for it. A
  # push to main gets a group of its own, so its checks are never cancelled
  # (GitHub also cancels a *pending* run of a shared group).
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PY27_IMAGE: python:2.7@sha256:cfa62318c459b1fde9e0841c619906d15ada5910d625176e24bf692cf8a2601d
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Names pyRevit injects into every script; pyflakes cannot see them.
      PYFLAKES_BUILTINS: __revit__,__shiftclick__,__forceddebugmode__,__eventsender__,__eventargs__,__context__,__commandpath__,__commandname__,__commandbundle__,__commandextension__,__commanduniqueid__,__commandcontrolid__,__result__,__execid__,__timestamp__,__cachedengine__,__cachedengineid__,__scriptruntime__,__file__
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This mount is read-write because compileall writes .pyc files. -f
      # compiles every file even if a .pyc that a pull request committed
      # claims to be up to date.
      - name: Compile and run pyflakes on Python 2.7
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e PYFLAKES_BUILTINS \
            -e PYTHONDONTWRITEBYTECODE=1 "$PY27_IMAGE" \
            bash -euo pipefail -c '
              pip install -q --require-hashes --only-binary=:all: -r .github/requirements-ci.txt
              git config --global --add safe.directory /src
              python -m compileall -q -f -x "(^|/)\.github/" .
              python .github/scripts/pyflakes_check.py --root .
            '

  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit tests of the checks, then the policy check
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src \
            -e PYTHONDONTWRITEBYTECODE=1 "$PY27_IMAGE" \
            bash -euo pipefail -c '
              pip install -q --require-hashes --only-binary=:all: -r .github/requirements-ci.txt
              git config --global --add safe.directory /src
              python -m unittest discover -s .github/scripts/tests -v
              python .github/scripts/policy_check.py --root .
            '

  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the pyRevit layout
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src \
            -e PYTHONDONTWRITEBYTECODE=1 "$PY27_IMAGE" \
            bash -euo pipefail -c '
              pip install -q --require-hashes --only-binary=:all: -r .github/requirements-ci.txt
              git config --global --add safe.directory /src
              python .github/scripts/structure_check.py --root .
            '

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The whole history is scanned, so a secret that a later commit
      # deleted is still found. The gitleaks-action wrapper is not used: it
      # needs a license for organizations.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only the history is mounted, read-only, and nothing else of the
      # checkout but the config below. A pull request controls the work tree, and from there it
      # could switch the scan off: gitleaks loads /repo/.gitleaks.toml and
      # /repo/.gitleaksignore when they exist, and a .gitattributes line such
      # as "*.txt -diff" makes git print no text diff for those files. None of
      # these exists next to a bare .git. --ignore-gitleaks-allow makes a
      # "gitleaks:allow" comment in the code unable to hide a finding too.
      # Our own allowlist lives under .github/ (it needs a code owner's
      # review) and is mounted on its own, read-only, with --config: it
      # keeps the default rules and allows only the public token that the
      # usage data client sent up to 0.2.0, still in the history.
      - name: Scan the git history with gitleaks
        run: |
          docker run --rm -v "$PWD/.git:/repo/.git:ro" \
            -v "$PWD/.github/gitleaks.toml:/config/gitleaks.toml:ro" "$GITLEAKS_IMAGE" \
            git /repo --config /config/gitleaks.toml --redact --no-banner -v \
            --ignore-gitleaks-allow

  language:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that code, comments and UI text are in English
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src \
            -e PYTHONDONTWRITEBYTECODE=1 "$PY27_IMAGE" \
            bash -euo pipefail -c '
              git config --global --add safe.directory /src
              python .github/scripts/language_check.py --root .
            '
