name: Release

# On a version tag (v0.1.0, v1.2.3...), build magic-tools.zip (it holds a
# MagicTools.extension/ folder) and attach it to a GitHub release. The ZIP
# is uploaded as a release asset of its own, not left to GitHub's automatic "Source code (zip)", because only
# an uploaded asset has a download_count the stats workflow can read.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the ZIP
        # git archive ships exactly what is committed; export-ignore paths
        # in .gitattributes stay out of the ZIP.
        run: |
          git archive --format=zip --prefix=MagicTools.extension/ \
            -o magic-tools.zip "$GITHUB_REF_NAME"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" magic-tools.zip \
            --title "$GITHUB_REF_NAME" --generate-notes
