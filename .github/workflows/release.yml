name: Release

# On a version tag (v0.1.0, v1.2.3...): check that the tagged commit is on
# main, build magic-tools.zip (it holds one EXTENSION_FOLDER folder) and
# release-manifest.json (the SHA-256 of every file in the ZIP, text hashed
# with LF endings), attest both while the repository is public, and attach
# them to a GitHub release. The ZIP is a release asset of its own, not
# GitHub's automatic "Source code (zip)", because only an uploaded asset has
# a download_count the stats workflow can read.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  EXTENSION_FOLDER: magic-tools.extension

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tagged commit must be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points to $GITHUB_SHA, which is not on main."
            exit 1
          fi

      - name: Build the ZIP and the manifest
        # git archive ships exactly what is committed; export-ignore paths
        # in .gitattributes stay out of the ZIP.
        run: |
          git archive --format=zip --prefix="$EXTENSION_FOLDER/" \
            -o magic-tools.zip "$GITHUB_SHA"
          mkdir build
          unzip -q magic-tools.zip -d build
          python3 .github/scripts/release_manifest.py --root "build/$EXTENSION_FOLDER" \
            --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --out release-manifest.json

      - name: Attest the build
        # Attestations on private repositories need GitHub Enterprise.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            magic-tools.zip
            release-manifest.json

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" magic-tools.zip release-manifest.json \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
