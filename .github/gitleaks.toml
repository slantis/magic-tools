# gitleaks configuration of the secrets job (.github/workflows/checks.yml),
# mounted with --config. Every default rule stays on; this file only adds one
# allowlist entry.
#
# The token below is the one the usage data client (lib/telemetry.py) sent
# up to 0.2.0, to the webhooks it used then. It was public on purpose and
# protects nothing; the client sends no token since 0.2.1, but the token is
# still in the git history, which this job scans whole.

[extend]
useDefault = true

[[allowlists]]
description = "Public token of the usage data client up to 0.2.0"
regexes = [
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiJtYWdpYy10b29scy1vcGVuLXNvdXJjZSIsImlhdCI6MTc5MTMxMTcxM30\.51thxorsiPW0aE9qQVJ9DdJ46RW5Nlr1CUtSHvH-pQs''',
]
