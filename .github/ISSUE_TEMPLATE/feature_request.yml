name: Feature request
description: An idea for an existing tool, or a new tool.
labels: [enhancement]
body:
  - type: input
    id: tool
    attributes:
      label: Tool
      description: The tool this is about, or "new tool".
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task in Revit, and what makes it slow or hard today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
